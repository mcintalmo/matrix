events {}

http {
    # Speed optimizations
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Docker internal DNS resolver (required for upstream hostname resolution and OCSP)
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # SSL session caching - returning visitors skip the full handshake
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name matrix.rumpusroom.xyz rumpusroom.xyz chat.rumpusroom.xyz element.rumpusroom.xyz call.rumpusroom.xyz livekit.rumpusroom.xyz;

        # ACME challenge for Let's Encrypt renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main server block for Matrix and MAS API endpoints
    server {
        listen 443 ssl http2;
        server_name matrix.rumpusroom.xyz rumpusroom.xyz;

        ssl_certificate /etc/letsencrypt/live/matrix.rumpusroom.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/matrix.rumpusroom.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # OCSP stapling - server pre-fetches cert status so browsers don't have to
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/matrix.rumpusroom.xyz/chain.pem;

        # Well-Known Discovery (served inline by nginx)
        location /.well-known/matrix/server {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header "Access-Control-Allow-Headers" "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;

            if ($request_method = OPTIONS) {
                add_header "Access-Control-Allow-Origin" * always;
                add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header "Access-Control-Allow-Headers" "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
                add_header "Access-Control-Max-Age" 86400;
                add_header "Content-Type" "text/plain charset=UTF-8";
                add_header "Content-Length" 0;
                return 204;
            }

            return 200 '{"m.server": "matrix.rumpusroom.xyz:443"}';
        }

        location /.well-known/matrix/client {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header "Access-Control-Allow-Headers" "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;

            if ($request_method = OPTIONS) {
                add_header "Access-Control-Allow-Origin" * always;
                add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header "Access-Control-Allow-Headers" "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
                add_header "Access-Control-Max-Age" 86400;
                add_header "Content-Type" "text/plain charset=UTF-8";
                add_header "Content-Length" 0;
                return 204;
            }

            return 200 '{
                "m.homeserver": {
                    "base_url": "https://matrix.rumpusroom.xyz"
                },
                "org.matrix.msc2965.authentication": {
                    "issuer": "https://matrix.rumpusroom.xyz/",
                    "account": "https://matrix.rumpusroom.xyz/account"
                },
                "org.matrix.msc4143.rtc_foci": [
                    {
                        "type": "livekit",
                        "livekit_service_url": "https://call.rumpusroom.xyz"
                    }
                ],
                "io.element.e2ee": {
                    "secure_backup_required": true
                }
            }';
        }

        # ── Synapse Generic Worker Routes ─────────────────────────────────────────
        # Intercept heavy endpoints and route to the generic-worker
        # location ~ ^/_matrix/client/(r0|v3)/sync$ {
        #     proxy_pass http://synapse-generic-worker-1:8081;
        #     proxy_set_header X-Forwarded-For $remote_addr;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header Host $host;
        #     proxy_set_header Authorization $http_authorization;
        # }
        # 
        # location ~ ^/_matrix/client/(api/v1|r0|v3)/events$ {
        #     proxy_pass http://synapse-generic-worker-1:8081;
        #     proxy_set_header X-Forwarded-For $remote_addr;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header Host $host;
        #     proxy_set_header Authorization $http_authorization;
        # }
        # 
        # location ~ ^/_matrix/client/(api/v1|r0|v3)/initialSync$ {
        #     proxy_pass http://synapse-generic-worker-1:8081;
        #     proxy_set_header X-Forwarded-For $remote_addr;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header Host $host;
        #     proxy_set_header Authorization $http_authorization;
        # }
        # 
        # location ~ ^/_matrix/client/(api/v1|r0|v3)/rooms/[^/]+/initialSync$ {
        #     proxy_pass http://synapse-generic-worker-1:8081;
        #     proxy_set_header X-Forwarded-For $remote_addr;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header Host $host;
        #     proxy_set_header Authorization $http_authorization;
        # }

        # ── Matrix Authentication Service (MAS) Routes ────────────────────────────
        location ~ ^/_matrix/client/(.*)/(login|logout|refresh) {
            proxy_pass http://mas:8090;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/(.well-known/openid-configuration|_auth|oauth2|upstream|graphql|assets)(/.*)?$ {
            proxy_pass http://mas:8090;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # ── Grafana Telemetry Dashboard (Protected root path) ───────────────────
        location /_grafana/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_hide_header X-Frame-Options;
            add_header Cache-Control "no-cache";

            # Require basic authentication for an extra layer of security
            # (Requires setting up an htpasswd file via deploy.sh)
            auth_basic "Restricted Telemetry Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # ── Synapse Main App Routes ───────────────────────────────────────────
        # Synapse: Matrix client/federation API routes
        location /_matrix {
            proxy_pass http://synapse:8008;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            client_max_body_size 50M;
        }

        location /_synapse/client {
            proxy_pass http://synapse:8008;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            client_max_body_size 50M;
        }

        # Health check
        location /health {
            proxy_pass http://synapse:8008/health;
        }

        # Everything else goes to MAS (login, register, consent, oauth2, account, etc.)
        location / {
            proxy_pass http://mas:8090;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }
    }

    # Element Web Application Block
    server {
        listen 443 ssl http2;
        server_name chat.rumpusroom.xyz element.rumpusroom.xyz;

        ssl_certificate /etc/letsencrypt/live/matrix.rumpusroom.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/matrix.rumpusroom.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/matrix.rumpusroom.xyz/chain.pem;

        location ~* \.(js|css|woff2|woff|ttf|ico|png|svg|jpg|webp)$ {
            proxy_pass http://element-web:80;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://element-web:80;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache";
        }
    }

    # Element Call Application Block
    server {
        listen 443 ssl http2;
        server_name call.rumpusroom.xyz;

        ssl_certificate /etc/letsencrypt/live/matrix.rumpusroom.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/matrix.rumpusroom.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://element-call:8080;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache";
        }
    }

    # LiveKit JWT and API Block
    server {
        listen 443 ssl http2;
        server_name livekit.rumpusroom.xyz;

        ssl_certificate /etc/letsencrypt/live/matrix.rumpusroom.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/matrix.rumpusroom.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        
        # Route LiveKit HTTP checks
        location / {
            proxy_pass http://livekit:7880;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        # Route WebRTC signaling to the LiveKit server
        location /rtc {
            proxy_pass http://livekit:7880;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            # WebSockets support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}