global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Connect to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "/etc/prometheus/alert.rules"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "synapse"
    metrics_path: "/_synapse/metrics"
    static_configs:
      - targets: ["synapse:9092"]
        labels:
          instance: "synapse-main"
      - targets: ["synapse-generic-worker-1:9092"]
        labels:
          instance: "synapse-worker-1"
      - targets: ["synapse-federation-sender-1:9092"]
        labels:
          instance: "synapse-federation-sender-1"

  - job_name: "mas"
    static_configs:
      - targets: ["mas:8081"]

  - job_name: "livekit"
    static_configs:
      - targets: ["livekit:7880"]
