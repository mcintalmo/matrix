name: Deploy Matrix Server

on:
  workflow_dispatch:  # Manual trigger from GitHub UI (re-enable push after setting secrets)
  # push:
  #   branches: [main]

jobs:
  deploy:
    name: Deploy to Oracle VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Write .env file from GitHub Secrets
        run: |
          cat > .env <<EOF
          DOMAIN=${{ secrets.DOMAIN || 'rumpusroom.xyz' }}
          MATRIX_FQDN=${{ secrets.MATRIX_FQDN || 'matrix.rumpusroom.xyz' }}
          ELEMENT_WEB_FQDN=${{ secrets.ELEMENT_WEB_FQDN || 'element-web.rumpusroom.xyz' }}
          ELEMENT_CALL_FQDN=${{ secrets.ELEMENT_CALL_FQDN || 'element-call.rumpusroom.xyz' }}
          LIVEKIT_FQDN=${{ secrets.LIVEKIT_FQDN || 'livekit.rumpusroom.xyz' }}
          CHAT_FQDN=${{ secrets.CHAT_FQDN || 'chat.rumpusroom.xyz' }}
          CALL_FQDN=${{ secrets.CALL_FQDN || 'call.rumpusroom.xyz' }}
          SERVER_IP=${{ secrets.SERVER_IP }}
          SECRETS_POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          SECRETS_SYNAPSE_MACAROON_SECRET_KEY=${{ secrets.SYNAPSE_MACAROON_SECRET_KEY }}
          SECRETS_SYNAPSE_FORM_SECRET=${{ secrets.SYNAPSE_FORM_SECRET }}
          SECRETS_MAS_MATRIX_SECRET=${{ secrets.MAS_SYNAPSE_SHARED_SECRET }}
          SECRETS_MAS_ADMIN_TOKEN=${{ secrets.MAS_ADMIN_TOKEN }}
          SECRETS_MAS_ENCRYPTION_SECRET=${{ secrets.MAS_ENCRYPTION_SECRET }}
          MAS_KEY_ID=${{ secrets.MAS_KEY_ID }}
          MAS_SIGNING_KEY='${{ secrets.MAS_SIGNING_KEY }}'
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_ACCOUNT=${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          SECRETS_TURN_SHARED_SECRET=${{ secrets.TURN_SHARED_SECRET }}
          LIVEKIT_KEY=${{ secrets.LIVEKIT_KEY }}
          LIVEKIT_SECRET=${{ secrets.LIVEKIT_SECRET }}
          SYNAPSE_REPORT_STATS=no
          EOF

      - name: Write Synapse signing key
        run: |
          mkdir -p synapse-data
          echo "${{ secrets.SYNAPSE_SIGNING_KEY }}" > synapse-data/${{ secrets.DOMAIN || 'rumpusroom.xyz' }}.signing.key

      - name: Make scripts executable
        run: chmod +x scripts/matrix-ctl scripts/*.sh

      - name: Pre-flight validation
        run: ./scripts/matrix-ctl check

      - name: Render configuration templates
        run: ./scripts/matrix-ctl render

      - name: Deploy files via rsync
        run: |
          rsync -avz --progress \
            --exclude '.git' \
            --exclude '.archive' \
            --exclude '*.bak' \
            --exclude '.vscode' \
            --exclude 'infra/' \
            ./ ubuntu@${{ secrets.SERVER_IP }}:/opt/matrix/app/

      - name: Start / update containers
        run: |
          ssh ubuntu@${{ secrets.SERVER_IP }} \
            "cd /opt/matrix/app && docker compose up -d --remove-orphans"

      - name: Verify deployment
        run: |
          sleep 10
          ssh ubuntu@${{ secrets.SERVER_IP }} \
            "cd /opt/matrix/app && ./scripts/matrix-ctl status"
