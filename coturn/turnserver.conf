# Coturn TURN server configuration for Matrix Synapse

# Listening port for TURN/STUN
listening-port=3478
tls-listening-port=5349

# Listening IP (0.0.0.0 = all interfaces)
listening-ip=0.0.0.0

# External IP will be auto-detected in Docker
# For production, set: external-ip=YOUR_PUBLIC_IP

# Relay IP (internal)
relay-ip=0.0.0.0

# Port range for media relay
min-port=49152
max-port=49172

# Enable verbose logging (useful for debugging)
verbose

# Realm for TURN authentication
# For local: use localhost
# For production: use your domain (e.g., matrix.rumpusroom.xyz)
realm=matrix.rumpusroom.xyz

# Use static auth secret (shared with Synapse)
# NOTE: This will be replaced by environment variable in production
use-auth-secret
static-auth-secret=${SECRETS_TURN_SHARED_SECRET}

# Deny access to private IP ranges (security)
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# Performance tuning
# no-tcp-relay  # Uncomment to disable TCP relay (UDP only)
# no-tls        # Uncomment to disable TLS
# no-dtls       # Uncomment to disable DTLS

# Logging
log-file=stdout
simple-log

# Database for long-term credentials (not needed for static secret)
# no-auth

# WebRTC compatibility
fingerprint
lt-cred-mech

# Total quota per user (in bytes)
user-quota=12
total-quota=1200

# No CLI
no-cli

# Process management
pidfile="/var/tmp/turnserver.pid"
